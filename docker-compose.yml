services:
  spark-master:
    build: .
    image: climate-spark:local
    container_name: climate-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "0.0.0.0"]
    ports:
      - "7077:7077"
      - "18080:8080"
    volumes:
      - .:/app

  spark-worker-1:
    image: climate-spark:local
    container_name: climate-spark-worker-1
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "2G", "--work-dir", "/tmp/spark-worker"]
    ports:
      - "8081:8081"
    volumes:
      - .:/app

  spark-worker-2:
    image: climate-spark:local
    container_name: climate-spark-worker-2
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "2G", "--work-dir", "/tmp/spark-worker"]
    ports:
      - "8082:8081"
    volumes:
      - .:/app

  spark-app:
    image: climate-spark:local
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - .:/app
    working_dir: /app
    command: ["python3", "-m", "pytest", "tests", "-q"]
